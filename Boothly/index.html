<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boothly Photobooth</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f6fb;
        --card: rgba(255, 255, 255, 0.96);
        --text: #243041;
        --muted: #66758b;
        --accent: #ff6e8f;
        --border: rgba(72, 85, 104, 0.14);
        --shadow: 0 24px 80px rgba(36, 48, 65, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(255, 195, 169, 0.42), transparent 28%),
          radial-gradient(circle at top right, rgba(193, 225, 255, 0.42), transparent 28%),
          var(--bg);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .shell {
        width: min(100%, 560px);
        display: grid;
        place-items: center;
      }

      .status {
        color: var(--muted);
        font-size: 0.98rem;
        letter-spacing: 0.02em;
      }

    </style>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const status = document.getElementById("status");
        const target = "pages/home.html";

        async function checkDatabase() {
          try {
            const response = await fetch("api/photobooth.php?action=health", { cache: "no-store" });
            const data = await response.json();
            if (response.ok && data.ok) {
              window.location.replace(target);
              return;
            }
            throw new Error(data.message || "Database error");
          } catch {
            if (status) status.textContent = "Database error";
            window.alert("Database error");
          }
        }

        checkDatabase();
      });
    </script>
  </head>
  <body>
    <main class="shell" aria-live="polite">
      <div class="status" id="status">Checking database connection...</div>
    </main>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boothly - Choose layout</title>
    <link rel="stylesheet" href="../../css/styles.css" />
    <script defer src="../../js/app.js"></script>
  </head>
  <body data-page="photobooth-layout">
    <div class="page-bg"></div>
    <main class="site-shell">
      <div class="container" data-include="header"></div>

      <section class="page photobooth-page">
        <div class="container photobooth-landing">
          <div class="photobooth-stack">
            <div>
              <p class="photobooth-kicker">Choose your strip</p>
              <h1 class="photobooth-title">Pick a layout</h1>
              <p class="photobooth-copy">Choose the photo arrangement for this session before the camera opens.</p>
            </div>

            <div class="photobooth-choice-grid photobooth-layout-grid">
              <button class="photobooth-choice" type="button" data-layout-choice="1x4">
                <span class="photobooth-choice-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="6" y="3" width="12" height="18" rx="2"></rect>
                    <path d="M6 8h12M6 13h12M6 18h12"></path>
                  </svg>
                </span>
                <strong>1 x 4</strong>
                <span>Classic vertical strip</span>
              </button>

              <button class="photobooth-choice" type="button" data-layout-choice="2x2">
                <span class="photobooth-choice-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="4" width="16" height="16" rx="2"></rect>
                    <path d="M4 12h16M12 4v16"></path>
                  </svg>
                </span>
                <strong>2 x 2</strong>
                <span>Balanced square grid</span>
              </button>
            </div>

            <p class="photobooth-muted">Selected layout: <strong data-layout-selected>1 x 4</strong></p>

            <div class="photobooth-actions">
              <button class="btn btn-secondary" data-layout-back>Back</button>
              <button class="btn btn-primary" data-layout-next>Next</button>
            </div>
          </div>
        </div>
      </section>

      <div class="container" data-include="footer"></div>
    </main>
  </body>
</html>

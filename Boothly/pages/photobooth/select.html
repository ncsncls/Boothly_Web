<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boothly - Choose photos</title>
    <link rel="stylesheet" href="../../css/styles.css" />
    <script defer src="../../js/app.js"></script>
  </head>
  <body data-page="photobooth-select">
    <div class="page-bg"></div>
    <main class="site-shell">
      <div class="container" data-include="header"></div>

      <section class="page photobooth-page">
        <div class="container photobooth-landing">
          <div class="photobooth-stack">
            <div>
              <p class="photobooth-kicker">Choose your photos</p>
              <h1 class="photobooth-title">Pick the shots</h1>
              <p class="photobooth-copy">Tap a photo to place it into a slot, then continue when your strip looks right.</p>
            </div>

            <div class="photobooth-select-wrap">
              <div class="photobooth-select-board" data-select-board>
                <div class="photobooth-select-slot" data-select-slot><span>1</span></div>
                <div class="photobooth-select-slot" data-select-slot><span>2</span></div>
                <div class="photobooth-select-slot" data-select-slot><span>3</span></div>
                <div class="photobooth-select-slot" data-select-slot><span>4</span></div>
              </div>

              <div class="photobooth-source-grid" data-select-sources>
                <button class="photobooth-source-card" type="button" data-select-source></button>
                <button class="photobooth-source-card" type="button" data-select-source></button>
                <button class="photobooth-source-card" type="button" data-select-source></button>
                <button class="photobooth-source-card" type="button" data-select-source></button>
              </div>
            </div>

            <div class="photobooth-actions">
              <button class="btn btn-secondary" data-select-back>Back</button>
              <button class="btn btn-primary" data-select-next>Next</button>
            </div>
          </div>
        </div>
      </section>

      <div class="container" data-include="footer"></div>
    </main>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boothly - Download</title>
    <link rel="stylesheet" href="../../css/styles.css" />
    <script defer src="../../js/app.js"></script>
  </head>
  <body data-page="photobooth-download">
    <div class="page-bg"></div>
    <main class="site-shell">
      <div class="container" data-include="header"></div>

      <section class="page photobooth-page">
        <div class="container photobooth-landing">
          <div class="photobooth-stack">
            <div>
              <p class="photobooth-kicker">All done</p>
              <h1 class="photobooth-title">Download your photo</h1>
              <p class="photobooth-copy">Save the final strip to your device when you’re ready.</p>
            </div>

            <div class="photobooth-download-card">
              <div class="photobooth-filter-preview">
                <img data-download-preview alt="Final strip preview" />
              </div>
            </div>

            <div class="photobooth-actions">
              <button class="btn btn-secondary" data-download-back>Back</button>
              <button class="btn btn-primary" data-download-final>Download</button>
            </div>
          </div>
        </div>
      </section>

      <div class="container" data-include="footer"></div>
    </main>
  </body>
</html>
